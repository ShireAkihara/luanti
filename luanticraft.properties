# ============================================================
#  LuantiCraft - konfigurasi pusat. Ubah di sini, lalu jalankan:
#     python tools\luanticraft\apply_branding.py
# ============================================================
app.name=LuantiCraft
app.applicationId=com.luanticraft.app
app.versionName=1.0.0
app.versionCode=1

# Base game yang dibundel ke dalam APK (folder games/<id>)
basegame.id=mineclonia
basegame.repo=https://codeberg.org/mineclonia/mineclonia.git
# Boleh branch, tag, atau commit SHA. Untuk build yang bisa direproduksi, isi tag/SHA.
basegame.ref=HEAD

# ABI target (dipisah koma)
android.abis=arm64-v8a,armeabi-v7a
